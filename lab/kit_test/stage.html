<!doctype html>
<html><head><meta charset="utf-8">
<!-- Kit test stage.  Draws ONE time t from window.TL (compiled by compile.py).
     Open as stage.html?tl=out/<plan>/timeline.js&still=<i>  (or &t=<seconds>).
     Seek-based: nothing here depends on wall-clock time or the previous frame. -->

<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  #frame { position: relative; width: 1080px; height: 1920px; overflow: hidden;
           background: var(--bg) center / cover no-repeat; }
  .layer { position: absolute; inset: 0; }
  /* an OPAQUE surface per skin: anything laid over footage or the presenter must be readable */
  #frame { color: var(--ink); --solid: var(--card-bg); }
  #frame.skin-night-hud { --solid: #0A1124; }
  #frame.skin-chalk-slate { --solid: #22302B; }
  #cap, .k-counter.boxed, .crosses, .compare .k-card, .imgcard, .k-check-row, .k-sticker, .hl-xl, .k-def, .k-section-tag { background: var(--solid) !important; }
  .k-torn { --torn-bg: var(--solid); }
  .skin-chalk-slate .k-pill:not(.k-pill--accent), .skin-night-hud .k-pill:not(.k-pill--accent) { background: var(--solid); }
  .abs { position: absolute; }
  #broll { position: absolute; left: 0; top: 150px; width: 1080px; height: 860px; overflow: hidden;
           background: var(--photo-tint); }
  #broll img { width: 100%; height: 100%; object-fit: cover; display: block;
               filter: grayscale(1) contrast(1.25) brightness(1.08); mix-blend-mode: screen; }
  #broll.navy { background: var(--accent-2); }
  #broll.colour { background: #000; } #broll.colour img { filter: none; mix-blend-mode: normal; }
  #broll.skinphoto { background: #000; } #broll.skinphoto img { filter: var(--photo-filter); mix-blend-mode: normal; }
  #broll.skinphoto::after { background-image: none; }
  .skin-night-hud #broll.skinphoto { box-shadow: inset 0 0 0 2px var(--accent); }
  .skin-night-hud #broll.skinphoto::after { background: linear-gradient(180deg, transparent 55%, rgba(5,8,15,.75)); mix-blend-mode: normal; }
  .skin-chalk-slate #broll.skinphoto { outline: 3px dashed rgba(241,240,230,.6); outline-offset: -14px; }
  #broll::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                  background-image: radial-gradient(rgba(0,0,0,.22) 1px, transparent 1.4px);
                  background-size: 6px 6px; mix-blend-mode: multiply; }

  #presenter { position: absolute; filter: drop-shadow(0 0 0 #fff) drop-shadow(0 10px 18px rgba(0,0,0,.25)); }

  #spine { position: absolute; left: 40px; right: 40px; top: 40px; height: 90px;

  #spine .ttl { font-family: var(--font-head); font-weight: var(--head-weight); font-stretch: var(--head-stretch);

  .chain { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }

             border: var(--card-border-w) solid var(--card-border); box-shadow: var(--shadow); }
  .crosses svg { width: 78px; height: 78px; }

  /* caption: torn strip, one line at a time, keywords underlined in red */
  #cap { position: absolute; left: 50%; width: max-content; max-width: 960px; transform: translateX(-50%);

  .ask-text { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 62px; line-height: 1.3; color: var(--ink); text-wrap: balance; }
  .ask-a { display: flex; align-items: center; gap: 20px; border-top: 3px dashed color-mix(in srgb, var(--accent) 45%, transparent); padding-top: 16px; }

  .ask-a .tick svg { width: 40px; height: 40px; }
  .ask-a .txt { font-family: var(--font-body); font-weight: 800; font-size: 52px; line-height: 1.35; color: var(--ink); }
  /* inset: then-and-now, a framed photo over the full-frame background, each side named */
  .inset { background: #fff; padding: 14px 14px 0; box-shadow: 0 16px 34px rgba(0,0,0,.5); }
  .inset img { display: block; }
  .inset .lab { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 40px; text-align: center; padding: 10px 6px 14px; color: #222; }
  .main-lab { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 46px; color: #fff; text-shadow: var(--halo, 0 2px 6px rgba(0,0,0,.9));
              background: rgba(0,0,0,.45); padding: 6px 22px 10px; border-radius: 10px; }
  /* tracker: the points done so far, always in the corner, so the student never loses the map */
  #tracker { position: absolute; left: 30px; display: flex; flex-direction: column; gap: 8px; max-width: 540px; }
  #tracker .row { display: flex; align-items: center; gap: 14px; background: var(--solid); border-radius: 30px; padding: 4px 22px 6px 6px;

  /* ---- elements from the team's reference board (Pinterest "resources-for-video-gen"), built natively ---- */
  .srch { width: 900px; height: 118px; box-sizing: border-box; display: flex; align-items: center; gap: 22px; padding: 0 30px;
          background: #fff; border-radius: 60px; box-shadow: 0 14px 30px rgba(0,0,0,.35), 0 0 0 4px var(--accent); }
  .srch svg { flex: none; width: 58px; height: 58px; color: var(--accent); }
  .srch .q { font-family: var(--font-body); font-weight: 800; font-size: 50px; color: #222; white-space: nowrap; overflow: hidden; }
  .srch .caret { display: inline-block; width: 4px; height: 52px; background: var(--accent); vertical-align: middle; margin-left: 4px; }
  .tgl { display: flex; align-items: center; gap: 28px; padding: 18px 34px; background: var(--solid); border-radius: 70px; box-shadow: 0 12px 26px rgba(0,0,0,.35); width: max-content; }
  .tgl .track { position: relative; width: 170px; height: 90px; border-radius: 45px; flex: none; }
  .tgl .knob { position: absolute; top: 8px; width: 74px; height: 74px; border-radius: 50%; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.35); }
  .tgl .lab { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 58px; color: var(--ink); }
  .qm { position: absolute; font-family: var(--font-num); font-weight: 700; color: var(--accent); text-shadow: 0 4px 12px rgba(0,0,0,.45); }
  .tline { width: 960px; position: relative; padding: 30px 0 10px; }
  .tline .node { position: absolute; top: 68px; width: 52px; height: 52px; margin-left: -26px; box-sizing: border-box; border-radius: 50%; background: #fff; border: 12px solid var(--accent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 30%, transparent), 0 6px 14px rgba(0,0,0,.35); }
  .tline .yr { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--font-num); font-weight: 700; font-size: 52px; color: var(--accent-2);
               background: var(--solid); padding: 0 14px; border-radius: 10px; white-space: nowrap; }
  .tline .lb { position: absolute; top: 140px; transform: translateX(-50%); width: 230px; text-align: center; font-family: var(--font-body); font-weight: 800; font-size: 38px;

  .prog { display: flex; align-items: center; gap: 34px; background: var(--solid); padding: 26px 40px; border-radius: 26px; box-shadow: 0 14px 30px rgba(0,0,0,.35); width: max-content; max-width: 960px; box-sizing: border-box; }
  .prog .pc { font-family: var(--font-num); font-weight: 700; font-size: 74px; fill: var(--ink); }
  .prog .lab { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 56px; line-height: 1.25; color: var(--ink); max-width: 520px; }
  .vrd { position: absolute; width: 300px; height: 300px; }
  .ntf { width: 900px; display: flex; flex-direction: column; gap: 18px; }
  .ntf .ncard { display: flex; gap: 22px; align-items: center; background: rgba(255,255,255,.97); border-radius: 26px; padding: 20px 26px; box-shadow: 0 12px 26px rgba(0,0,0,.35); }
  .ntf .ic { flex: none; width: 84px; height: 84px; border-radius: 20px; background: var(--accent); color: #fff; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 50px; }
  .ntf .t { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 44px; color: #1b1b1b; line-height: 1.25; }
  .ntf .b { font-family: var(--font-body); font-weight: 800; font-size: 38px; color: #555; line-height: 1.3; }
  .pin { position: absolute; width: 76px; height: 100px; margin: -100px 0 0 -38px; }
  .pin-tag { position: absolute; transform: translate(-50%, 6px); white-space: nowrap; font-family: var(--font-head); font-weight: var(--head-weight); font-size: 40px;
             color: #fff; background: #D7261E; padding: 2px 16px 6px; border-radius: 10px; box-shadow: 0 6px 14px rgba(0,0,0,.35); }
  .note-paper { width: 820px; box-sizing: border-box; padding: 60px 50px 46px 96px; position: relative; color: #1E2A55;
                background: repeating-linear-gradient(180deg, transparent 0 63px, rgba(60,90,160,.28) 63px 65px), #FBF8EF;
                box-shadow: 0 16px 34px rgba(0,0,0,.4); font-family: 'Kalam', var(--font-body); font-size: 52px; line-height: 65px;
                -webkit-mask: radial-gradient(circle 9px at 50% 9px, transparent 98%, #000) -12px -9px / 26px 100% repeat-y,
                              linear-gradient(#000, #000) 14px 0 / calc(100% - 14px) 100% no-repeat; }
  .note-paper::before { content: ""; position: absolute; left: 70px; top: 0; bottom: 0; width: 3px; background: rgba(220,60,60,.6); }
  .note-tape { position: absolute; left: 50%; top: -26px; width: 200px; height: 56px; transform: translateX(-50%) rotate(-3deg); background: rgba(214,190,120,.78);
               box-shadow: 0 3px 6px rgba(0,0,0,.2); }
  #cap .hl { text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 5px;
             text-underline-offset: 10px; }
</style></head>
<body>
<div id="frame"></div>
<script>
const q = new URLSearchParams(location.search);
const s = document.createElement('script');
s.src = q.get('tl');
s.onload = async () => {
  const th = q.get('theme') ?? window.TL.theme;
  if (th) {
    await new Promise(r => { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = `themes/${th}.css`; l.onload = r; l.onerror = r; document.head.appendChild(l); });
    await Promise.all(['56px "Rozha One"', '56px "Yatra One"', '46px Kalam', '700 44px Martel', '800 44px Martel', '40px "Tiro Devanagari Hindi"'].map(f => document.fonts.load(f, 'भारत पाकिस्तान 1947')));
  }
  await document.fonts.ready;
  window.THEME = th;
  if (q.get('render') === '1') { window.renderAt = t => draw(th, t); document.title = 'ready'; }
  else draw(th);
};
document.head.appendChild(s);

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M4 13 L9.5 18.5 L20 6"/></svg>';
const XMARK = '<svg viewBox="0 0 40 40" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"><path pathLength="1" d="M8 8 L32 32"/><path pathLength="1" d="M32 8 L8 32"/></svg>';
const DOWN = '<svg class="arrow" viewBox="0 0 40 56" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M20 4 L20 48"/><path pathLength="1" d="M8 36 L20 50 L32 36"/></svg>';

// entrance at local progress p: pop / stamp / slide / fade
let FX = null;            // an element may name its own entrance ("fx"): applies to everything it draws
function enter(node, kind, p) {
  if (p >= 1) return;
  kind = FX || kind;
  if (kind === 'drop') { const k = back(p); node.style.transform = (node.style.transform || '') + ` translateY(${-90 * (1 - k)}px)`; node.style.opacity = clamp(p * 3); return; }
  if (kind === 'rise') { node.style.transform = (node.style.transform || '') + ` translateY(${70 * (1 - ease(p))}px)`; node.style.opacity = ease(p); return; }
  if (kind === 'zoom') { node.style.transform = (node.style.transform || '') + ` scale(${0.55 + 0.45 * back(p)})`; node.style.filter = `blur(${(10 * (1 - ease(p))).toFixed(1)}px)`; node.style.opacity = clamp(p * 2.5); return; }
  if (kind === 'wipe') { node.style.clipPath = `inset(-20px ${(100 * (1 - ease(p))).toFixed(1)}% -20px -20px)`; return; }
  if (kind === 'unfold') { node.style.transformOrigin = '50% 0'; node.style.transform = (node.style.transform || '') + ` scaleY(${(0.02 + 0.98 * ease(p)).toFixed(3)})`; node.style.opacity = clamp(p * 4); return; }   // no overshoot: a tall sheet must not grow into the presenter
  if (kind === 'blur') { node.style.filter = `blur(${(14 * (1 - ease(p))).toFixed(1)}px)`; node.style.opacity = ease(p); return; }
  if (kind === 'pop') { node.style.transform = (node.style.transform || '') + ` scale(${0.4 + 0.6 * back(p)})`; node.style.opacity = clamp(p * 3); }
  else if (kind === 'stamp') { node.style.transform = (node.style.transform || '') + ` scale(${1.8 - 0.8 * ease(p)})`; node.style.opacity = clamp(p * 4); }
  else if (kind === 'slide') { node.style.transform = (node.style.transform || '') + ` translateX(${-60 * (1 - ease(p))}px)`; node.style.opacity = ease(p); }
  else node.style.opacity = ease(p);
}
function drawPaths(node, p) {
  node.querySelectorAll('path[pathLength]').forEach((path, i, all) => {
    const q = clamp(p * all.length - i);
    path.style.strokeDasharray = '1 1'; path.style.strokeDashoffset = 1 - ease(q);
  });
}

function draw(THEME, tOverride) {
  const TL = window.TL;
  const RENDER = q.get('render') === '1';   // graphics layer only: footage and presenter are composited elsewhere
  const still = q.get('still');
  const t = tOverride ?? (still != null ? TL.stills[+still].t : +(q.get('t') || 0));
  const A = q.get('tl').replace(/timeline\.js$/, 'assets/');
  const S = still != null ? TL.stills[+still] : {};
  const F = document.getElementById('frame');
  if (window.lottie) lottie.destroy();          // last frame's animations, before their nodes go
  F.innerHTML = ''; F.removeAttribute('style');
  const SKIN = q.get('skin') || TL.skin;
  F.className = 'skin-' + SKIN + (THEME ? ' theme-' + THEME : '');
  // one plate per skin; the plan never names a file
  const PLATES = {
    'paper-editorial': 'generated/paper-editorial-cream.jpg',
    'night-hud': 'earth/portrait/night-iss-delhi-stars-1080x1920.jpg',
    'chalk-slate': 'generated/chalk-slate-green-smudged.jpg',
    'pastel-notebook': 'generated/pastel-notebook-ruled.jpg' };
  const DIM = { 'night-hud': 'linear-gradient(rgba(5,8,15,.62),rgba(5,8,15,.62)),', 'chalk-slate': '' };
  const THEME_PLATES = { 'paper-archival': 'generated/paper-archival-folded.jpg', 'field-journal': 'generated/field-journal-topo.jpg', 'terrain-atlas': 'generated/terrain-atlas-himalaya.jpg', 'survey-light': 'generated/pasture-himachal.jpg', 'dossier': 'generated/dossier-manila.jpg' };
  const PLAN_PLATE = TL.plate_path || null;
  const plateOverride = q.get('plate');
  if (RENDER) { F.style.background = 'transparent'; document.body.style.background = 'transparent'; }
  else F.style.backgroundImage = `${DIM[SKIN] || ''}url(../../library/backgrounds/plates/${plateOverride ? 'generated/' + plateOverride + '.jpg' : (PLAN_PLATE || THEME_PLATES[THEME] || PLATES[SKIN])})`;
  const beat = TL.beats.find(b => t >= b.t_in && t < b.t_out) || TL.beats[TL.beats.length - 1];
  if (!RENDER && beat.plate) F.style.backgroundImage = `url(../../library/backgrounds/plates/generated/${beat.plate}.jpg)`;   // a beat may bring its own background
  const pb = beat.pbox;
  const floor = pb.head - 24;                     // nothing may reach the presenter's head
  const boxes = [];                               // every content box, for the gates
  const panelBot = floor - 6;                     // a top panel ends just above his head
  const midY = Math.round((150 + panelBot) / 2);

  if (beat.flood) F.appendChild(el('div', '', '')).id = 'flood';
  if (beat.broll && beat.broll.clip && q.get('placeholder') === '1') {
    // PLAN VIEW: where a generated clip will play, an empty frame that says which one and what it shows
    const id = beat.broll.clip || 'photo';
    const ph = el('div', '', `<div style="position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:860px;text-align:center;color:#fff;font-family:'Noto Sans Devanagari',sans-serif">
        <div style="font-family:Khand;font-weight:700;font-size:120px;letter-spacing:4px;color:#7FD3E6">VEO ${id.toUpperCase()}</div>
        <div style="font-size:40px;font-weight:600;line-height:1.35;margin-top:10px;opacity:.9">${(TL.shots || {})[id] || beat.broll.photo || ''}</div>
        ${beat.broll.dim ? '<div style="font-size:34px;margin-top:16px;color:#F2B63C">dimmed under the panel</div>' : ''}</div>`);
    ph.id = 'ph';

            svg += `<circle cx="${(x + loose).toFixed(1)}" cy="${(y + loose * 0.6).toFixed(1)}" r="${(14 * ease((t - ti) / 0.3)).toFixed(1)}" fill="url(#pearl)" stroke="rgba(60,40,20,.55)" stroke-width="2"/>`;
          });
        }
        const named = (e.ports || []).filter(pt => t >= pt[3]);
        const lastT = named.length ? Math.max(...named.map(pt => pt[3])) : -1;
        for (const [label, sub, ll, tp, side] of named) {
          const [x, y] = P(ll);
          svg += `<circle cx="${x}" cy="${y}" r="${tp === lastT && t - tp < 2.5 ? 20 : 15}" class="port-dot"/>`;
          extras.push(['port', [label, sub, side, tp === lastT && !e.calm], [x, y], tp]);
        }
        n.innerHTML = svg + '</svg>';
        for (const rg of e.regions || []) {
          if (!rg.label || t < rg.t_label) continue;
          const [x, y] = P(rg.label_xy); const rl = el('div', 'port-tag on', rg.label);
          Object.assign(rl.style, { left: x + 'px', top: y + 'px', transform: 'translate(-50%,-50%)', fontSize: '40px' }); n.appendChild(rl); enter(rl, 'pop', (t - rg.t_label) / 0.4);
        }
        if (e.region_label && t >= e.t_region_label) { const [x, y] = P(e.region_label_xy); const rl = el('div', 'port-tag on', e.region_label);
          Object.assign(rl.style, { left: x + 'px', top: y + 'px', transform: 'translate(-50%,-50%)', fontSize: '44px' }); n.appendChild(rl); enter(rl, 'pop', (t - e.t_region_label) / 0.4); }
        for (const [txt, ll, tl_, cls] of e.labels || []) {
          if (t < tl_) continue;
          const [x, y] = P(ll); const lb = el('div', 'map-label' + (cls ? ' ' + cls : ''), txt);
          Object.assign(lb.style, { left: x + 'px', top: y + 'px', transform: 'translate(-50%,-50%)' }); n.appendChild(lb); enter(lb, 'fade', (t - tl_) / 0.5);
        }
        for (const [kind, data, [x, y], tx, warn] of extras) {
          if (kind === 'port') {
            const [label, sub, side, on] = data;
            const tg = el('div', 'port-tag' + (on ? ' on' : ''), label + (sub ? `<small>${sub}</small>` : ''));
            const off = { n: [0, -34, '-50%', '-100%'], s: [0, 34, '-50%', '0%'], e: [30, 0, '0%', '-50%'], w: [-30, 0, '-100%', '-50%'],
                          nw: [-18, -24, '-100%', '-100%'], ne: [18, -24, '0%', '-100%'], sw: [-18, 24, '-100%', '0%'], se: [18, 24, '0%', '0%'] }[side || 'n'];
            Object.assign(tg.style, { left: (x + off[0]) + 'px', top: (y + off[1]) + 'px', transform: `translate(${off[2]},${off[3]})` });
            n.appendChild(tg); enter(tg, 'pop', (t - tx) / 0.4);
          } else {
            const tg = el('div', 'port-tag on', data);
            if (!warn) tg.style.cssText += ';background:var(--accent);border-color:var(--accent);color:#06202B';
            else tg.style.cssText += ';background:#E2574C;border-color:#E2574C;color:#fff';
            Object.assign(tg.style, { left: x + 'px', top: y + 'px', transform: 'translate(-50%,-50%)' });
            n.appendChild(tg); enter(tg, 'pop', (t - tx) / 0.4);
          }
        }
        place(n, e.slot); n.style.left = Math.round((1080 - W_) / 2) + 'px'; enter(n, 'fade', p);
        break; }
      case 'note':
        n = el('div', 'note' + (e.slot.startsWith('over-broll') ? ' on-photo' : ''), e.text); place(n, e.slot); n.style.transform = (n.style.transform || '') + ' rotate(-3deg)'; enter(n, 'fade', p); break;
      case 'cards3': {
        n = el('div', ''); Object.assign(n.style, { width: '960px', display: 'flex', flexDirection: 'column', gap: '22px' });
        e.items.forEach(([txt, ti], i) => {
          if (t < ti) return;
          const c = el('div', 'card', `<span class="k-section-tag__num" style="flex:none">${i + 1}</span><span style="font-family:var(--font-body);font-weight:800;font-size:46px;line-height:1.35">${txt}</span>`);
          Object.assign(c.style, { display: 'flex', alignItems: 'center', gap: '26px', padding: '22px 30px', boxSizing: 'border-box', transform: `rotate(${i % 2 ? .8 : -.8}deg)` });
          n.appendChild(c); enter(c, 'slide', (t - ti) / 0.45);
        });
        place(n, e.slot); break; }
      case 'pin': {
        if (!mapBox) break;
        const r = mapBox.getBoundingClientRect(), pad = 14;
        const x = r.left + pad + e.map_xy[0] * (r.width - 2 * pad), y = r.top + pad + e.map_xy[1] * (r.height - 2 * pad);
        let ring;
        if (THEME === 'paper-archival' || THEME === 'dossier') {
          ring = el('div', '', `<svg width="150" height="110" viewBox="0 0 150 110" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"><path pathLength="1" d="M108 18 C80 2 22 10 12 44 C2 80 52 102 96 94 C136 86 148 50 124 26 C112 14 92 8 70 10"/></svg>`);
          ring.className = 'abs'; ring.style.left = (x - 75) + 'px'; ring.style.top = (y - 55) + 'px';
          content.appendChild(ring); drawPaths(ring, p * 1.2);
        } else { ring = el('div', 'ring'); ring.style.left = x + 'px'; ring.style.top = y + 'px'; content.appendChild(ring); enter(ring, 'pop', p); }
        n = el('div', 'k-pill k-pill--accent', e.sub); n.classList.add('abs');
        n.style.left = (x - 30) + 'px'; n.style.top = (y + 56) + 'px';   // below the dot: the atlas prints the name above it
        content.appendChild(n); enter(n, 'slide', (t - t0 - 0.3) / 0.45);
        if (x + 70 + n.offsetWidth > 1040) { n.style.left = (x - 70 - n.offsetWidth) + 'px'; }
        break; }
      case 'pill':
        n = el('span', 'k-pill' + (e.style === 'accent' ? ' k-pill--accent' : ''), e.text);
        place(n, e.slot); enter(n, 'pop', p); break;
      case 'pills':
        n = el('div', '', ''); n.style.display = 'flex'; n.style.gap = '18px'; n.style.flexWrap = 'wrap'; n.style.maxWidth = '960px';
        for (const [txt, ti] of e.items) if (t >= ti) {
          const pi = el('span', 'k-pill' + (e.style === 'accent' ? ' k-pill--accent' : ''), txt);
          enter(pi, 'pop', (t - ti) / 0.45); n.appendChild(pi);
        }
        place(n, e.slot); break;
      case 'section':
        n = el('div', 'k-section-tag k-head', `<span class="k-section-tag__num">${e.num}</span><span class="k-section-tag__text">${e.text}</span>`);
        place(n, e.slot); enter(n, 'slide', p); break;
      case 'bignum':
        n = el('div', 'bignum', `<span class="n">${e.num}</span><span class="tx k-head">${e.text}</span>`);
        place(n, e.slot); n.style.top = '420px'; enter(n, 'stamp', p); break;
      case 'def':
        n = el('div', 'k-def', `<span class="k-def__term k-head">${e.term}</span><span class="k-def__eq">=</span><span class="k-def__text">${e.text}</span>`);
        place(n, e.slot); enter(n, 'slide', p); break;
      case 'torn':
        n = el('div', 'k-torn k-head', e.text); n.style.maxWidth = '960px'; n.style.fontSize = '52px';
        place(n, e.slot); enter(n, 'slide', p); break;
      case 'stamp':
        n = el('div', 'k-stamp k-head' + (e.slot.startsWith('over-broll') ? ' on-photo' : ''), e.text);
        if (!THEME) n.style.background = 'color-mix(in srgb, var(--paper) 88%, transparent)';
        place(n, e.slot);
        if (e.slot === 'over-broll-low') { n.style.left = 'auto'; n.style.right = '70px'; }
        enter(n, 'stamp', p); break;
      case 'counter':
        n = el('div', 'k-counter boxed', `<div class="k-counter__num"><b>${e.num}</b></div><div class="k-counter__label">${e.label}</div>`);
        place(n, e.slot); enter(n, 'stamp', p); break;
      case 'crosses':
        n = el('div', 'crosses', XMARK.repeat(e.n) + `<span class="lb k-head">${e.label}</span>`);
        place(n, e.slot); drawPaths(n, p / 2); break;
      case 'compare': {
        n = el('div', 'compare');
        const show_r = t >= (e.t_right ?? t0);
        n.innerHTML = `<div class="k-card l"><div class="lab">${e.left[0]}</div><div class="val k-head">${e.left[1]}</div></div>
                       <div class="vs k-head">लेकिन</div>
                       <div class="k-card r" style="visibility:${show_r ? 'visible' : 'hidden'}"><div class="lab">${e.right[0]}</div><div class="val k-head">${e.right[1]}</div></div>`;
        n.style.width = '960px'; place(n, e.slot); if (e.slot !== 'under-upper') n.style.top = '420px'; enter(n, 'slide', p);
        if (show_r) enter(n.querySelector('.r'), 'pop', (t - e.t_right) / 0.45);
        break; }
      case 'chain': {
        if (THEME === 'paper-archival') {
          n = el('div', 'chain');
          const shown = e.items.filter(([, ti]) => t >= ti);
          shown.forEach(([txt], i) => {
            const c = el('span', 'k-pill' + (i === e.items.length - 1 ? ' k-pill--accent' : ''), txt);
            c.style.marginLeft = (i % 2 ? 60 : 0) + 'px'; c.style.maxWidth = '900px'; c.style.alignSelf = 'flex-start';
            n.appendChild(c); enter(c, 'slide', (t - e.items[i][1] - 0.25) / 0.45);
          });
          place(n, e.slot);
          const pins = [...n.querySelectorAll('.k-pill')].map(c => { const r = c.getBoundingClientRect(), o = n.getBoundingClientRect(); return [r.left - o.left + 35, r.top - o.top - 1]; });
          if (pins.length > 1) {
            let d = `M${pins[0][0]} ${pins[0][1]}`;
            for (let k = 1; k < pins.length; k++) { const [x0, y0] = pins[k - 1], [x1, y1] = pins[k]; d += ` Q${(x0 + x1) / 2} ${Math.max(y0, y1) + 40} ${x1} ${y1}`; }
            const sv = el('div', 'thread', `<svg width="1000" height="600" style="overflow:visible"><path pathLength="1" d="${d}" fill="none" stroke="#B71C1C" stroke-width="4"/></svg>`);
            n.insertBefore(sv, n.firstChild); drawPaths(sv, (t - e.items[pins.length - 1][1]) / 0.5);
          }
          break;
        }
        n = el('div', 'chain');
        e.items.forEach(([txt, ti], i) => {
          if (t < ti) return;
          if (i) { const a = el('div', '', DOWN); n.appendChild(a); drawPaths(a, (t - ti) / 0.4); }
          const c = el('span', 'k-pill' + (i === e.items.length - 1 ? ' k-pill--accent' : ''), txt);
          n.appendChild(c); enter(c, 'slide', (t - ti - 0.2) / 0.45);
        });
        place(n, e.slot); break; }
      case 'checklist': {
        n = el('div', 'ledger', ''); n.style.width = '960px'; n.style.boxSizing = 'border-box'; n.style.display = 'flex'; n.style.flexDirection = 'column'; n.style.gap = '6px';
        TL.spine.items.forEach((txt, i) => {
          const lit = e.lit.includes(i) || (e.lit_t && e.lit_t[i] != null && t >= e.lit_t[i]);
          const r = el('div', 'k-card k-check-row' + (lit ? ' is-done' : ''),
            `<span class="k-badge k-badge--sm">${i + 1}</span><span class="k-check-row__text">${txt}</span><span class="k-check-row__tick">${CHECK}</span>`);
          r.style.background = 'var(--card-bg)'; r.style.border = 'var(--card-border-w) solid var(--card-border)';
          enter(r, 'slide', (t - t0 - i * 0.12) / 0.45);
          if (lit) drawPaths(r.querySelector('.k-check-row__tick'), (t - t0 - 0.5 - i * 0.2) / 0.5);
          n.appendChild(r);
          if (e.next_label && i === e.lit[e.lit.length - 1]) n.appendChild(el('div', 'next k-head', e.next_label + ' : 3, 4, 5'));
        });
        place(n, e.slot); break; }
    }
    if (n && n.isConnected) {
      if (e.slot === 'upper') { const r = n.getBoundingClientRect(); underY = r.bottom + 28; }
      boxes.push({ type: e.type, slot: e.slot, el: n });
    }
  }

  // spine: title, five dots, counter — from show_t on
  if (t >= TL.spine.show_t) {
    const lit = (TL.spine.pre_lit || 0) + TL.spine.lit_t.filter(x => t >= x).length;
    const sp = el('div', '', `<div class="ttl">${TL.spine.title}</div><div class="right"><div class="k-dots">${TL.spine.items.map((_, i) => `<i class="${i < lit ? 'on' : ''}"></i>`).join('')}</div><div class="cnt">${lit}<span>/${TL.spine.items.length}</span></div></div>`);
    sp.id = 'spine'; F.appendChild(sp);
  }

  // tracker: the points finished so far, bottom left beside the presenter card (card beats only:
  // a free-standing presenter or the hub fill that corner).  A beat may switch it off.
  if (TL.tracker && t >= TL.tracker.show_t && pb.card && beat.tracker !== false) {
    const lit = (TL.spine.pre_lit || 0) + TL.spine.lit_t.filter(x => t >= x).length;
    const last = Math.max(-1, ...TL.spine.lit_t.map((x, i) => t >= x ? i : -1));
    if (lit > 0) {
      const tr = el('div', ''); tr.id = 'tracker';
      TL.spine.items.slice(0, lit).forEach((txt, i) => {
        const r = el('div', 'row' + (i === lit - 1 ? ' now' : ''), `<span class="n">${i + 1}</span><span class="tx">${(TL.tracker.items || TL.spine.items)[i]}</span>`);
        tr.appendChild(r);
        if (i === lit - 1) enter(r, 'slide', (t - TL.spine.lit_t[Math.max(0, last)]) / 0.45);
      });
      tr.style.bottom = (1920 - pb.box[1] - pb.box[3]) + 'px';
      F.appendChild(tr);
      boxes.push({ type: 'tracker', slot: 'corner', el: tr });
    }
  }

  // caption: the line being spoken, placed where it covers no content box
  const line = t >= (TL.captions_from || 0) ? TL.captions.find(c => t >= c.t0 && t < c.t1 + 0.15) : null;
  const report = { t, beat: beat.id, presenter: beat.presenter, violations: [] };
  const rects = boxes.map(b => ({ ...b, r: b.el.getBoundingClientRect() }));
  for (const b of rects) {
    if (pb.hub) {
      const [x0, y0, x1, y1] = pb.face;
      const dx = Math.max(x0 - b.r.right, 0, b.r.left - x1), dy = Math.max(y0 - b.r.bottom, 0, b.r.top - y1);
      if (dx === 0 && dy === 0 && b.slot !== 'around-hub') report.violations.push(`${b.type}@${b.slot} overlaps the presenter circle`);
      continue;
    }
    if (b.slot === 'corner') { if (pb.card && b.r.right > pb.box[0] - 12) report.violations.push(`tracker runs into the presenter card (right ${Math.round(b.r.right)})`); continue; }
    if (b.r.bottom > floor + 1) report.violations.push(`${b.type}@${b.slot} reaches the presenter (bottom ${Math.round(b.r.bottom)} > head ${pb.head})`);
    const settled = !b.el.style.opacity || +b.el.style.opacity >= 1;   // an entrance slide starts off its mark
    if (settled && (b.r.left < 20 || b.r.right > 1060)) report.violations.push(`${b.type}@${b.slot} leaves the frame`);
  }
  if (line) {
    let txt = line.text;
    for (const w of TL.hilite) txt = txt.split(w).join(`<span class="hl">${w}</span>`);
    const cap = el('div', 'k-torn k-head', txt); cap.id = 'cap'; F.appendChild(cap);
    const cands = TL.captions_at === 'bottom' ? [1920 - 70]                                              // pinned: always the bottom strip
      : [1920 - 70, pb.face[3] + 120, floor - 20, ...(pb.hub ? [pb.cy - pb.r - 30] : []), 285];   // bottom, under his face, above his head, under the spine
    let ok = false;
    for (const fs of [46, 40, 35]) { if (ok) break; cap.style.fontSize = fs + 'px';
    for (const bottom of cands) {
      cap.style.top = ''; cap.style.bottom = (1920 - bottom) + 'px';
      const cr = cap.getBoundingClientRect();
      const [fx0, fy0, fx1, fy1] = pb.face;
      const obst = rects.map(b => b.r).concat([{ left: fx0, top: fy0, right: fx1, bottom: fy1 }]);
      const hit = obst.find(r => !(cr.right < r.left || cr.left > r.right || cr.bottom < r.top || cr.top > r.bottom));
      if (!hit) { ok = true; report.caption_at = Math.round(cr.top); break; }
    }}
    if (!ok && TL.captions_at === 'bottom') { cap.style.fontSize = '44px'; cap.style.top = ''; cap.style.bottom = '70px'; report.violations.push('caption (pinned bottom) overlaps content'); }
    else if (!ok) report.violations.push('caption has no position clear of content');
  }
  window.REPORT = report;
  document.title = 'ready';
}
</script>
</body></html>
