<script>
const q = new URLSearchParams(location.search);
const s = document.createElement('script');

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - clamp(x), 3);
const back = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
// ---- the realistic apparatus (wheatstone / metrebridge with look: "real", after a reference design the team liked,
// 23 Oct 2026): a varnished board, brass binding posts, ceramic resistors, an ebonite galvanometer with a real dial.
// Same geometry, cues and animation as the schematic drawings; only the parts are drawn as the lab objects they are.
const RDEFS = `<defs>
  <filter id="rsh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#1A0D03" flood-opacity=".55"/></filter>

  <radialGradient id="rbrass" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#FFF6CF"/><stop offset=".35" stop-color="#E9C766"/><stop offset=".75" stop-color="#B38A2C"/><stop offset="1" stop-color="#6E5214"/></radialGradient>
  <linearGradient id="rbrassbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6DE8E"/><stop offset=".5" stop-color="#C9A23F"/><stop offset="1" stop-color="#7A5A17"/></linearGradient>
  <linearGradient id="rcopper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B07A"/><stop offset=".45" stop-color="#C46F35"/><stop offset="1" stop-color="#7C3A12"/></linearGradient>
  <linearGradient id="rceramic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A89878"/><stop offset=".25" stop-color="#F3E9D2"/><stop offset=".45" stop-color="#FFFBF1"/><stop offset=".8" stop-color="#D2C3A0"/><stop offset="1" stop-color="#8E7E5E"/></linearGradient>
  <linearGradient id="rsteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E636B"/><stop offset=".4" stop-color="#E8EBEF"/><stop offset="1" stop-color="#7D838C"/></linearGradient>
  <linearGradient id="rebon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A4A"/><stop offset=".3" stop-color="#1E1E1E"/><stop offset="1" stop-color="#0C0C0C"/></linearGradient>
  <linearGradient id="rebonv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0C0C0C"/><stop offset=".35" stop-color="#5A5A5A"/><stop offset=".6" stop-color="#1C1C1C"/><stop offset="1" stop-color="#050505"/></linearGradient>
  <linearGradient id="rcell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A2A2A"/><stop offset=".3" stop-color="#8A8A8A"/><stop offset=".55" stop-color="#4A4A4A"/><stop offset="1" stop-color="#151515"/></linearGradient>
  <linearGradient id="rcap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A1010"/><stop offset=".35" stop-color="#F0595A"/><stop offset="1" stop-color="#6A0C0C"/></linearGradient>
  <linearGradient id="rdial" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4E1D8"/></linearGradient>
  <linearGradient id="rruler" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBEFC8"/><stop offset=".6" stop-color="#EBD392"/><stop offset="1" stop-color="#CDAE62"/></linearGradient>
  <linearGradient id="rbevel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD9A8" stop-opacity=".9"/><stop offset=".5" stop-color="#8A4A1E" stop-opacity=".2"/><stop offset="1" stop-color="#3A1A06" stop-opacity=".9"/></linearGradient>
  <radialGradient id="rspark" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#FFE680"/><stop offset="1" stop-color="#FFB000" stop-opacity="0"/></radialGradient>
</defs>`;
const R_ = {
  board: (W, H, id) => `<clipPath id="bc${id}"><rect x="8" y="8" width="${W - 16}" height="${H - 16}" rx="26"/></clipPath>
    <image href="../../library/elements/textures/board-cherry.jpg" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice" clip-path="url(#bc${id})"/>
    <rect x="12" y="12" width="${W - 24}" height="${H - 24}" rx="23" fill="none" stroke="url(#rbevel)" stroke-width="8"/>`,
  rod: (p, q) => { const L = Math.hypot(q[0] - p[0], q[1] - p[1]), nx = -(q[1] - p[1]) / L, ny = (q[0] - p[0]) / L;
    const ln = (w, c, dx = 0, dy = 0) => `<line x1="${(p[0] + dx).toFixed(1)}" y1="${(p[1] + dy).toFixed(1)}" x2="${(q[0] + dx).toFixed(1)}" y2="${(q[1] + dy).toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
    return `<g filter="url(#rsh2)">${ln(10, '#474B51')}${ln(6, '#BFC5CD')}</g>${ln(2, '#FAFBFC', -nx * 1.6, -ny * 1.6)}`; },
  resistor: (cx, cy, ang, len = 128, th = 44) => { const h = th / 2, b = len / 2;
    const bands = [['#B3261E', -.32], ['#B3261E', -.2], ['#6B3E1E', -.08], ['#C9A23A', .24]].map(([c, f]) => `<rect x="${(f * len).toFixed(1)}" y="${-h + 1}" width="${(len * .07).toFixed(1)}" height="${th - 2}" fill="${c}" opacity=".92"/>`).join('');
    return `<g transform="translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${ang.toFixed(1)})" filter="url(#rsh2)">
      <rect x="${-b}" y="${(-h * .55).toFixed(1)}" width="${len}" height="${(th * .55).toFixed(1)}" rx="4" fill="url(#rsteel)"/>
      <rect x="${-b + 12}" y="${-h}" width="${len - 24}" height="${th}" rx="${h}" fill="url(#rceramic)" stroke="#7D6D4F" stroke-width="1.2"/>
      ${bands}<rect x="${-b + 22}" y="${-h + 5}" width="${len - 44}" height="5" rx="2.5" fill="#fff" opacity=".55"/></g>`; },
  post: (x, y, r = 20) => `<g filter="url(#rsh2)"><circle cx="${x}" cy="${y}" r="${r}" fill="#5A4210"/><circle cx="${x}" cy="${y}" r="${r - 3}" fill="url(#rbrass)"/>
      <circle cx="${x}" cy="${y}" r="${r - 4}" fill="none" stroke="#7A5A17" stroke-width="${r > 14 ? 3 : 1.5}" stroke-dasharray="2 3"/>
      <circle cx="${x}" cy="${y}" r="${(r * .45).toFixed(1)}" fill="url(#rbrass)" stroke="#7A5A17" stroke-width="1.5"/>
      <ellipse cx="${(x - r * .3).toFixed(1)}" cy="${(y - r * .35).toFixed(1)}" rx="${(r * .28).toFixed(1)}" ry="${(r * .16).toFixed(1)}" fill="#fff" opacity=".75"/></g>`,
  cable: d => `<path d="${d}" fill="none" stroke="#141414" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#rsh2)"/>
      <path d="${d}" fill="none" stroke="#6A6A6A" stroke-width="1.6" stroke-linecap="round" transform="translate(-1 -1.5)" opacity=".8"/>`,
  meter: (cx, cy, s, deg, ok) => { let ticks = '';
    for (let a = -50; a <= 50; a += 5) { const r0 = a % 25 ? 50 : 44, ra = a * Math.PI / 180;
      ticks += `<line x1="${(r0 * Math.sin(ra)).toFixed(1)}" y1="${(14 - r0 * Math.cos(ra)).toFixed(1)}" x2="${(56 * Math.sin(ra)).toFixed(1)}" y2="${(14 - 56 * Math.cos(ra)).toFixed(1)}" stroke="${a ? '#2B2B2B' : '#C62828'}" stroke-width="${a % 25 ? 1.6 : 2.6}"/>`; }
    const ra = deg * Math.PI / 180;

      <rect x="-80" y="-74" width="160" height="148" rx="16" fill="url(#rebon)" stroke="#000" stroke-width="2"/>
      <rect x="-72" y="-69" width="144" height="9" rx="4.5" fill="#fff" opacity=".13"/>
      <rect x="-64" y="-58" width="128" height="84" rx="8" fill="url(#rdial)" stroke="${ok ? '#22C55E' : '#8A8A8A'}" stroke-width="${ok ? 6 : 2}"/>
      ${ticks}<line x1="0" y1="14" x2="${(54 * Math.sin(ra)).toFixed(1)}" y2="${(14 - 54 * Math.cos(ra)).toFixed(1)}" stroke="#D21F1F" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="0" cy="14" r="5.5" fill="#222"/><path d="M-62 -56 L-14 -56 L-42 24 L-62 24Z" fill="#fff" opacity=".14"/>
      <rect x="-40" y="38" width="80" height="20" rx="4" fill="#2A2A2A" stroke="#444" stroke-width="1"/></g>`; },
  cell: (x, y) => `<g filter="url(#rsh2)"><rect x="${x}" y="${y - 24}" width="132" height="48" rx="8" fill="url(#rcell)"/>
      <rect x="${x + 104}" y="${y - 24}" width="34" height="48" rx="6" fill="url(#rcap)"/><rect x="${x + 138}" y="${y - 9}" width="10" height="18" rx="3" fill="url(#rsteel)"/>
      <rect x="${x + 8}" y="${y - 18}" width="120" height="5" rx="2.5" fill="#fff" opacity=".35"/></g>`,
  key: (x, y) => `<g filter="url(#rsh2)"><rect x="${x - 48}" y="${y - 30}" width="96" height="60" rx="6" fill="url(#rebon)"/>
      <rect x="${x - 40}" y="${y - 16}" width="32" height="32" rx="3" fill="url(#rbrassbar)"/><rect x="${x + 8}" y="${y - 16}" width="32" height="32" rx="3" fill="url(#rbrassbar)"/>
      <circle cx="${x}" cy="${y}" r="14" fill="url(#rbrass)"/><circle cx="${x}" cy="${y}" r="9" fill="#151515"/><ellipse cx="${x - 3}" cy="${y - 4}" rx="4" ry="2.4" fill="#fff" opacity=".5"/></g>`,
  jockey: (x, y) => `<g filter="url(#rsh)"><rect x="${x - 12}" y="${y - 118}" width="24" height="80" rx="11" fill="url(#rebonv)"/>
      <rect x="${x - 9}" y="${y - 40}" width="18" height="18" rx="2" fill="url(#rbrassbar)"/>
      <path d="M${x - 8} ${y - 22} L${x + 8} ${y - 22} L${x + 1.5} ${y - 3} L${x - 1.5} ${y - 3}Z" fill="#C9CED6" stroke="#6B7078" stroke-width="1"/></g>`,
  spark: (x, y, r = 13) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="url(#rspark)"/>`,
  drop: (o, s) => o > 0 ? `<g opacity="${o.toFixed(2)}" transform="translate(0 ${(-24 * (1 - o)).toFixed(1)})">${s}</g>` : '',
};
function realWheatstone(e, t, W, H) {
  const A = [140, 330], B = [480, 92], C = [820, 330], D = [480, 568], G = [480, 330], yb = H - 96;
  const on = k => e[k] != null && t >= e[k], fade = k => on(k) ? ease((t - e[k]) / 0.45) : 0;
  let svg = RDEFS + R_.board(W, H, 'w');
  if (on('t_cell'))        // the outer loop: cell and key between A and C
    svg += R_.drop(fade('t_cell'), R_.cable(`M${A[0]} ${A[1]} L${A[0]} ${yb - 20} Q${A[0]} ${yb} ${A[0] + 20} ${yb} L300 ${yb} M448 ${yb} L562 ${yb} M658 ${yb} L${C[0] - 20} ${yb} Q${C[0]} ${yb} ${C[0]} ${yb - 20} L${C[0]} ${C[1]}`)
      + R_.cell(300, yb) + R_.key(610, yb) + `<text class="hint" x="374" y="${yb + 62}" text-anchor="middle">सेल (E)</text><text class="hint" x="610" y="${yb + 62}" text-anchor="middle">कुंजी (K)</text>`);
  const arm = (key, p, q) => { const o = fade('t_' + key); if (!o) return '';
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, ang = Math.atan2(q[1] - p[1], q[0] - p[0]) * 180 / Math.PI;
    let nx = -(q[1] - p[1]), ny = q[0] - p[0]; const L = Math.hypot(nx, ny); nx /= L; ny /= L;
    if ((mx + nx - G[0]) ** 2 + (my + ny - G[1]) ** 2 < (mx - G[0]) ** 2 + (my - G[1]) ** 2) { nx = -nx; ny = -ny; }   // label on the outside
    return R_.drop(o, R_.rod(p, q) + R_.resistor(mx, my, ang) + `<text class="lab" x="${(mx + nx * 68).toFixed(1)}" y="${(my + ny * 68 + 18).toFixed(1)}" text-anchor="middle">${key}</text>`); };
  svg += arm('P', A, B) + arm('Q', B, C) + arm('R', A, D) + arm('S', D, C);
  const nulled = on('t_null'), gOk = nulled ? ease((t - e.t_null) / 0.5) : 0;
  if (on('t_galv')) {     // galvanometer between B and D: the needle swings while current flows, rests at zero once balanced
    const swing = !on('t_flow') ? 0 : nulled ? 0 : 38 * Math.sin((t - e.t_flow) * 5.2) * Math.exp(-0.15 * (t - e.t_flow)) + 18;

        } else { ring = el('div', 'ring'); ring.style.left = x + 'px'; ring.style.top = y + 'px'; content.appendChild(ring); enter(ring, 'pop', p); }
        n = el('div', 'k-pill k-pill--accent', e.sub); n.classList.add('abs');
        n.style.left = (x - 30) + 'px'; n.style.top = (y + 56) + 'px';   // below the dot: the atlas prints the name above it
        content.appendChild(n); enter(n, 'slide', (t - t0 - 0.3) / 0.45);
        if (x + 70 + n.offsetWidth > 1040) { n.style.left = (x - 70 - n.offsetWidth) + 'px'; }
        break; }
      case 'pill':
        n = el('span', 'k-pill' + (e.style === 'accent' ? ' k-pill--accent' : ''), e.text);
        place(n, e.slot); enter(n, 'pop', p); break;
      case 'pills':
        n = el('div', '', ''); n.style.display = 'flex'; n.style.gap = '18px'; n.style.flexWrap = 'wrap'; n.style.maxWidth = '960px';
        for (const [txt, ti] of e.items) if (t >= ti) {
          const pi = el('span', 'k-pill' + (e.style === 'accent' ? ' k-pill--accent' : ''), txt);
          enter(pi, 'pop', (t - ti) / 0.45); n.appendChild(pi);
        }
        place(n, e.slot); break;
      case 'section':
        n = el('div', 'k-section-tag k-head', `<span class="k-section-tag__num">${e.num}</span><span class="k-section-tag__text">${e.text}</span>`);
        place(n, e.slot); enter(n, 'slide', p); break;
      case 'bignum':
        n = el('div', 'bignum', `<span class="n">${e.num}</span><span class="tx k-head">${e.text}</span>`);
        place(n, e.slot); n.style.top = '420px'; enter(n, 'stamp', p); break;
      case 'def':
        n = el('div', 'k-def', `<span class="k-def__term k-head">${e.term}</span><span class="k-def__eq">=</span><span class="k-def__text">${e.text}</span>`);
        place(n, e.slot); enter(n, 'slide', p); break;
      case 'torn':
        n = el('div', 'k-torn k-head', e.text); n.style.maxWidth = '960px'; n.style.fontSize = '52px';
        place(n, e.slot); enter(n, 'slide', p); break;
      case 'stamp':
        n = el('div', 'k-stamp k-head' + (e.slot.startsWith('over-broll') ? ' on-photo' : ''), e.text);
        if (!THEME) n.style.background = 'color-mix(in srgb, var(--paper) 88%, transparent)';
        place(n, e.slot);
        if (e.slot === 'over-broll-low') { n.style.left = 'auto'; n.style.right = '70px'; }
        enter(n, 'stamp', p); break;
      case 'counter':
        n = el('div', 'k-counter boxed', `<div class="k-counter__num"><b>${e.num}</b></div><div class="k-counter__label">${e.label}</div>`);
        place(n, e.slot); enter(n, 'stamp', p); break;
      case 'crosses':
        n = el('div', 'crosses', XMARK.repeat(e.n) + `<span class="lb k-head">${e.label}</span>`);
        place(n, e.slot); drawPaths(n, p / 2); break;
      case 'compare': {
        n = el('div', 'compare');
        const show_r = t >= (e.t_right ?? t0);
        n.innerHTML = `<div class="k-card l"><div class="lab">${e.left[0]}</div><div class="val k-head">${e.left[1]}</div></div>
                       <div class="vs k-head">${e.vs ?? 'लेकिन'}</div>
                       <div class="k-card r" style="visibility:${show_r ? 'visible' : 'hidden'}"><div class="lab">${e.right[0]}</div><div class="val k-head">${e.right[1]}</div></div>`;
        if (e.val_size) n.querySelectorAll('.val').forEach(v => { v.style.fontSize = e.val_size + 'px'; });   // two-word names
        n.style.width = '960px'; place(n, e.slot); if (e.slot !== 'under-upper') n.style.top = '420px'; enter(n, 'slide', p);
        if (show_r) enter(n.querySelector('.r'), 'pop', (t - e.t_right) / 0.45);
        break; }
      case 'chain': {
        if (THEME === 'paper-archival') {
          n = el('div', 'chain');
          const shown = e.items.filter(([, ti]) => t >= ti);
          shown.forEach(([txt], i) => {
            const c = el('span', 'k-pill' + (i === e.items.length - 1 ? ' k-pill--accent' : ''), txt);
            c.style.marginLeft = (i % 2 ? 60 : 0) + 'px'; c.style.maxWidth = '900px'; c.style.alignSelf = 'flex-start';
            n.appendChild(c); enter(c, 'slide', (t - e.items[i][1] - 0.25) / 0.45);
          });
          place(n, e.slot);
          const pins = [...n.querySelectorAll('.k-pill')].map(c => { const r = c.getBoundingClientRect(), o = n.getBoundingClientRect(); return [r.left - o.left + 35, r.top - o.top - 1]; });
          if (pins.length > 1) {
            let d = `M${pins[0][0]} ${pins[0][1]}`;
            for (let k = 1; k < pins.length; k++) { const [x0, y0] = pins[k - 1], [x1, y1] = pins[k]; d += ` Q${(x0 + x1) / 2} ${Math.max(y0, y1) + 40} ${x1} ${y1}`; }
            const sv = el('div', 'thread', `<svg width="1000" height="600" style="overflow:visible"><path pathLength="1" d="${d}" fill="none" stroke="#B71C1C" stroke-width="4"/></svg>`);
            n.insertBefore(sv, n.firstChild); drawPaths(sv, (t - e.items[pins.length - 1][1]) / 0.5);
          }
          break;
        }
        n = el('div', 'chain');
        e.items.forEach(([txt, ti], i) => {
          if (t < ti) return;
          if (i) { const a = el('div', '', DOWN); n.appendChild(a); drawPaths(a, (t - ti) / 0.4); }
          const c = el('span', 'k-pill' + (i === e.items.length - 1 ? ' k-pill--accent' : ''), txt);
          n.appendChild(c); enter(c, 'slide', (t - ti - 0.2) / 0.45);
        });
        place(n, e.slot); break; }
      case 'checklist': {
        n = el('div', 'ledger', ''); n.style.width = '960px'; n.style.boxSizing = 'border-box'; n.style.display = 'flex'; n.style.flexDirection = 'column'; n.style.gap = '6px';
        TL.spine.items.forEach((txt, i) => {
          const lit = e.lit.includes(i) || (e.lit_t && e.lit_t[i] != null && t >= e.lit_t[i]);
          const r = el('div', 'k-card k-check-row' + (lit ? ' is-done' : ''),
            `<span class="k-badge k-badge--sm">${i + 1}</span><span class="k-check-row__text">${txt}</span><span class="k-check-row__tick">${CHECK}</span>`);
          r.style.background = 'var(--card-bg)'; r.style.border = 'var(--card-border-w) solid var(--card-border)';
          enter(r, 'slide', (t - t0 - i * 0.12) / 0.45);
          if (lit) drawPaths(r.querySelector('.k-check-row__tick'), (t - t0 - 0.5 - i * 0.2) / 0.5);
          n.appendChild(r);
          if (e.next_label && i === e.lit[e.lit.length - 1]) n.appendChild(el('div', 'next k-head', e.next_label + ' : 3, 4, 5'));
        });
        place(n, e.slot); break; }
    }
    if (n && n.isConnected) {
      if (e.slot === 'upper') { const r = n.getBoundingClientRect(); underY = r.bottom + 28; }
      boxes.push({ type: e.type, slot: e.slot, el: n });
    }
  }

  // spine: title, five dots, counter — from show_t on
  if (t >= TL.spine.show_t && beat.spine !== false) {      // a full-frame page hides it
    const lit = (TL.spine.pre_lit || 0) + TL.spine.lit_t.filter(x => t >= x).length;
    const sp = el('div', '', `<div class="ttl">${TL.spine.title}</div><div class="right"><div class="k-dots">${TL.spine.items.map((_, i) => `<i class="${i < lit ? 'on' : ''}"></i>`).join('')}</div><div class="cnt">${lit}<span>/${TL.spine.items.length}</span></div></div>`);
    sp.id = 'spine'; F.appendChild(sp);
  }

  // tracker: the points finished so far, bottom left beside the presenter card (card beats only:
  // a free-standing presenter or the hub fill that corner).  A beat may switch it off.
  if (TL.tracker && t >= TL.tracker.show_t && pb.card && beat.tracker !== false) {
    const lit = (TL.spine.pre_lit || 0) + TL.spine.lit_t.filter(x => t >= x).length;
    const last = Math.max(-1, ...TL.spine.lit_t.map((x, i) => t >= x ? i : -1));
    if (lit > 0) {
      const tr = el('div', ''); tr.id = 'tracker';
      TL.spine.items.slice(0, lit).forEach((txt, i) => {
        const r = el('div', 'row' + (i === lit - 1 ? ' now' : ''), `<span class="n">${i + 1}</span><span class="tx">${(TL.tracker.items || TL.spine.items)[i]}</span>`);
        tr.appendChild(r);
        if (i === lit - 1) enter(r, 'slide', (t - TL.spine.lit_t[Math.max(0, last)]) / 0.45);
      });
      tr.style.bottom = (1920 - pb.box[1] - pb.box[3] + 70) + 'px';   // clear of a two-line caption
      F.appendChild(tr);
      boxes.push({ type: 'tracker', slot: 'corner', el: tr });
    }
  }

  // caption: the line being spoken, placed where it covers no content box
  const line = t >= (TL.captions_from || 0) ? TL.captions.find(c => t >= c.t0 && t < c.t1 + 0.15) : null;
  const report = { t, beat: beat.id, presenter: beat.presenter, violations: [] };
  const rects = boxes.map(b => ({ ...b, r: b.el.getBoundingClientRect() }));
  for (const b of rects) {
    if (pb.hub) {
      const [x0, y0, x1, y1] = pb.face;
      const dx = Math.max(x0 - b.r.right, 0, b.r.left - x1), dy = Math.max(y0 - b.r.bottom, 0, b.r.top - y1);
      if (dx === 0 && dy === 0 && b.slot !== 'around-hub') report.violations.push(`${b.type}@${b.slot} overlaps the presenter circle`);
      continue;
    }
    if (b.slot === 'corner') { if (pb.card && b.r.right > pb.box[0] - 12) report.violations.push(`tracker runs into the presenter card (right ${Math.round(b.r.right)})`); continue; }
    if (b.r.bottom > floor + 1) report.violations.push(`${b.type}@${b.slot} reaches the presenter (bottom ${Math.round(b.r.bottom)} > head ${pb.head})`);
    const settled = !b.el.style.opacity || +b.el.style.opacity >= 1;   // an entrance slide starts off its mark
    if (settled && (b.r.left < 20 || b.r.right > 1060)) report.violations.push(`${b.type}@${b.slot} leaves the frame`);
  }
  if (line) {
    let txt = line.text;
    for (const w of TL.hilite) txt = txt.split(w).join(`<span class="hl">${w}</span>`);
    const cap = el('div', 'k-torn k-head', txt); cap.id = 'cap'; F.appendChild(cap);
    const cands = TL.captions_at === 'bottom' ? [1920 - 70]                                              // pinned: always the bottom strip
      : [1920 - 70, pb.face[3] + 120, floor - 20, ...(pb.hub ? [pb.cy - pb.r - 30] : []), 285];   // bottom, under his face, above his head, under the spine
    let ok = false;
    for (const fs of [46, 40, 35]) { if (ok) break; cap.style.fontSize = fs + 'px';
    for (const bottom of cands) {
      cap.style.top = ''; cap.style.bottom = (1920 - bottom) + 'px';
      const cr = cap.getBoundingClientRect();
      const [fx0, fy0, fx1, fy1] = pb.face;
      const obst = rects.map(b => b.r).concat([{ left: fx0, top: fy0, right: fx1, bottom: fy1 }]);
      const hit = obst.find(r => !(cr.right < r.left || cr.left > r.right || cr.bottom < r.top || cr.top > r.bottom));
      if (!hit) { ok = true; report.caption_at = Math.round(cr.top); break; }
    }}
    if (!ok && TL.captions_at === 'bottom') { cap.style.fontSize = '44px'; cap.style.top = ''; cap.style.bottom = '70px'; report.violations.push('caption (pinned bottom) overlaps content'); }
    else if (!ok) report.violations.push('caption has no position clear of content');
  }
  window.REPORT = report;
  document.title = 'ready';
}
</script>
</body></html>
