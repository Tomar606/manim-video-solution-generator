<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470">
  <!-- Metallic bonding: a lattice of positive metal ions sitting in a
       sea of delocalised electrons. In d-block metals both ns and (n-1)d
       electrons join that sea, so the bonding is unusually strong.
       No text elements: any label comes from the spec. -->
