<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700">
  <!-- [NiCl4]2- and [Fe(CN)6]3-, the two the question names.
       Ni2+ is d8; Cl- is a WEAK field ligand, so no pairing, sp3, TETRAHEDRAL,
       paramagnetic with two unpaired electrons.
       Fe3+ is d5; CN- is a STRONG field ligand, so the electrons pair up, an
       inner d orbital is freed, d2sp3, OCTAHEDRAL, low spin, one unpaired.
       The weak/strong field distinction is the whole answer -- swap it and both
       the hybridisation and the shape come out wrong. -->
  <g id="hy_tetra">
    <circle cx="270" cy="300" r="30" fill="#FFC53D" fill-opacity="0.85"/>
    <g stroke="#7FD4FF" stroke-width="6" stroke-linecap="round">
      <line x1="270" y1="300" x2="270" y2="170"/>
      <line x1="270" y1="300" x2="150" y2="378"/>
      <line x1="270" y1="300" x2="390" y2="378"/>
      <line x1="270" y1="300" x2="286" y2="418"/>
    </g>
    <g fill="#7BE3A0">
      <circle cx="270" cy="170" r="24"/><circle cx="150" cy="378" r="24"/>
      <circle cx="390" cy="378" r="24"/><circle cx="286" cy="418" r="24"/>
    </g>
    <path d="M270 170 L150 378 L390 378 Z" fill="none" stroke="#7FD4FF"
          stroke-width="2" stroke-opacity="0.45"/>
  </g>
  <g id="hy_octa">
    <circle cx="800" cy="300" r="30" fill="#FFC53D" fill-opacity="0.85"/>
    <g stroke="#7FD4FF" stroke-width="6" stroke-linecap="round">
      <line x1="800" y1="300" x2="800" y2="160"/>
      <line x1="800" y1="300" x2="800" y2="440"/>
      <line x1="800" y1="300" x2="660" y2="300"/>
      <line x1="800" y1="300" x2="940" y2="300"/>
      <line x1="800" y1="300" x2="710" y2="370"/>
      <line x1="800" y1="300" x2="890" y2="230"/>
    </g>
    <g fill="#7BE3A0">
      <circle cx="800" cy="160" r="24"/><circle cx="800" cy="440" r="24"/>
      <circle cx="660" cy="300" r="24"/><circle cx="940" cy="300" r="24"/>
      <circle cx="710" cy="370" r="24"/><circle cx="890" cy="230" r="24"/>
    </g>
    <path d="M800 160 L660 300 L800 440 L940 300 Z" fill="none" stroke="#7FD4FF"
          stroke-width="2" stroke-opacity="0.45"/>
  </g>
<style>
    text{font-family:Poppins,Mukta,'Noto Sans Devanagari',sans-serif;font-weight:800;
         fill:#FFFFFF;paint-order:stroke;stroke:#0B1220;stroke-width:7px;
         stroke-linejoin:round;text-anchor:middle}
    .t{font-size:36px} .s{font-size:29px} .g{fill:#FFC53D} .b{fill:#7FD4FF}
    .n{fill:#7BE3A0} .d{font-size:25px;fill:#9FB6CC}
  </style>
  <text class="t" x="270" y="58" >[NiCl₄]²⁻</text>
  <text class="t g" x="270" y="560" >sp³ — चतुष्फलकीय</text>
  <text class="s g" x="196" y="300" >Ni²⁺</text>
  <text class="s n" x="270" y="140" >Cl⁻</text>
  <text class="d" x="270" y="606" >दुर्बल क्षेत्र लिगन्ड · अयुग्मित</text>
  <text class="t" x="800" y="58" >[Fe(CN)₆]³⁻</text>
  <text class="t g" x="800" y="560" >d²sp³ — अष्टफलकीय</text>
  <text class="s g" x="726" y="300" >Fe³⁺</text>
  <text class="s n" x="800" y="132" >CN⁻</text>
  <text class="d" x="800" y="606" >प्रबल क्षेत्र लिगन्ड · युग्मित</text>
</svg>
