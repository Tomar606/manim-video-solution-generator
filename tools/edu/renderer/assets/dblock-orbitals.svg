<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470">
  <!-- d-block orbital boxes. Serves BOTH the definition segment and the
       partially-filled / transition-element segment.
       No <text> anywhere: "4s", "3d" etc. all come from the spec. -->
  <defs>
    <linearGradient id="boxFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FD8FF" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#1B6EA8" stop-opacity=".10"/>
    </linearGradient>
    <radialGradient id="eGlow"><stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="100%" stop-color="#FFC53D"/></radialGradient>
  </defs>

  <g id="s_box" data-optional>
    <rect x="95" y="175" width="115" height="115" rx="10"
          fill="url(#boxFill)" stroke="#7FD4FF" stroke-width="5"/>
  </g>
  <g id="s_electrons" data-optional stroke="#FFFFFF" stroke-width="6"
     stroke-linecap="round" fill="none">
    <path d="M130 267 V198 M130 198 l-13 18"/>
    <path d="M175 198 V267 M175 267 l13 -18"/>
  </g>

  <g id="d_boxes" data-optional fill="url(#boxFill)" stroke="#7FD4FF" stroke-width="5">
    <rect x="375" y="175" width="115" height="115" rx="10"/>
    <rect x="500" y="175" width="115" height="115" rx="10"/>
    <rect x="625" y="175" width="115" height="115" rx="10"/>
    <rect x="750" y="175" width="115" height="115" rx="10"/>
    <rect x="875" y="175" width="115" height="115" rx="10"/>
  </g>

  <g id="flying_e" data-optional>
    <circle cx="270" cy="232" r="18" fill="url(#eGlow)"/>
  </g>

  <g id="d_electron" data-optional stroke="#FFC53D" stroke-width="7"
     stroke-linecap="round" fill="none">
    <path d="M432 267 V198 M432 198 l-13 18"/>
  </g>

  <rect id="d_ring" data-optional x="362" y="162" width="141" height="141" rx="14"
        fill="none" stroke="#FFC53D" stroke-width="6" stroke-opacity=".9"/>

  <g id="d_partial" data-optional stroke="#FFFFFF" stroke-width="6"
     stroke-linecap="round" fill="none">
    <path d="M557 267 V198 M557 198 l-13 18"/>
    <path d="M682 267 V198 M682 198 l-13 18"/>
  </g>

  <path id="empty_mark" data-optional d="M750 306 v18 h240 v-18"
        fill="none" stroke="#FF9E5A" stroke-width="5" stroke-linecap="round"/>
</svg>
