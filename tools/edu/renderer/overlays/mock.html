<!doctype html>
<meta charset="utf-8">
<title>frame mock</title>
<!-- A full 1080x1920 frame, exactly as the finished video composes it: the
     house background, the caption band, and one photograph set in the stage
     band. Rendered in the browser so the fonts, the palette and the band
     geometry are the real ones rather than an approximation. The presenter is
     keyed on afterwards by ffmpeg.

     ?photo=<file>&cap=<text>&gold=<word>   -->  out/mock-*.png            -->
<link rel="stylesheet" href="../renderer/style.css">
<style>
  html,body{margin:0;padding:0;background:#000}
  #frame{position:relative;width:1080px;height:1920px;overflow:hidden;
         background:#000 url('../assets/chalk-background.png') center/cover no-repeat}
  #cap{position:absolute;left:70px;top:var(--cap-top);width:940px;
       text-align:center;font-family:Poppins,Mukta,sans-serif;font-weight:900;
       line-height:1.16;letter-spacing:-.5px;color:var(--ink);
       text-shadow:var(--shadow);font-size:64px;text-wrap:balance}
  #cap .g{color:var(--gold)}
  /* THE PHOTO IS A SPECIMEN, NOT A BACKGROUND. Set as a card inside the same
     band the diagrams use, so it reads as a thing being shown rather than as
     the plate changing colour. The band floor is 850 and the presenter's head
     starts around 1000, so nothing here can reach him. */
  #card{position:absolute;top:calc(var(--stage-top) + 15px);
        width:720px;height:440px;border-radius:22px;overflow:hidden;
        left:50%;transform:translateX(-50%);
        box-shadow:0 18px 48px rgba(0,0,0,.75), 0 0 0 3px rgba(127,212,255,.55)}
  #card img{width:100%;height:100%;object-fit:cover;display:block}
  /* WITH AN ELEMENT ALONGSIDE the photograph gives up the space for it, rather
     than the tile being squeezed into a corner of the plate. */
  body.el #card{width:620px;left:56px;transform:none}

  /* THE ELEMENT'S OWN CELL, drawn as the periodic table draws it: atomic number
     up in the corner, the symbol carrying the tile, the Hindi name under it and
     the mass at the foot. Every metal named in this answer -- Cr, Fe, Ni, Cu,
     Zn -- is a 3d transition metal in period 4, so the strip under the tile is
     saying something rather than decorating it. */
  #tile{position:absolute;display:none;top:calc(var(--stage-top) + 26px);
        left:730px;width:270px;height:300px;border-radius:18px;
        background:rgba(127,212,255,.10);border:4px solid #7FD4FF;
        box-shadow:0 14px 36px rgba(0,0,0,.7);
        font-family:Poppins,Mukta,sans-serif;color:var(--ink);
        text-shadow:var(--shadow)}
  body.el #tile{display:block}
  #tile .z{position:absolute;left:18px;top:10px;font-size:34px;font-weight:800}
  #tile .sym{position:absolute;left:0;top:58px;width:100%;text-align:center;
             font-size:112px;font-weight:900;line-height:1}
  #tile .nm{position:absolute;left:0;top:182px;width:100%;text-align:center;
            font-size:34px;font-weight:800}
  #tile .ms{position:absolute;left:0;top:230px;width:100%;text-align:center;
            font-size:28px;font-weight:700;opacity:.85}
  #blk{position:absolute;display:none;left:730px;width:270px;text-align:center;
       top:calc(var(--stage-top) + 340px);
       font-family:Poppins,Mukta,sans-serif;font-weight:800;font-size:26px;
       color:#7FD4FF;text-shadow:var(--shadow);white-space:nowrap}
  body.el #blk{display:block}
  /* the label that names what is in the photograph */
  #tag{position:absolute;left:50%;transform:translateX(-50%);
       top:calc(var(--stage-top) + 476px);
       font-family:Poppins,Mukta,sans-serif;font-weight:800;font-size:40px;
       color:var(--ink);text-shadow:var(--shadow);white-space:nowrap}
</style>

<div id="frame">
  <div id="cap"></div>
  <div id="card"><img id="img"></div>
  <div id="tile"><div class="z"></div><div class="sym"></div>
                 <div class="nm"></div><div class="ms"></div></div>
  <div id="blk"></div>
  <div id="tag"></div>
</div>

<script>
  const q = new URLSearchParams(location.search);
  const cap = q.get('cap') || '', gold = q.get('gold') || '';
  // With no photo this is a bare background-and-caption plate, for previewing a
  // band chip over it rather than mock.html's own card. Without this the empty
  // card outline shows through the chip and the preview lies about the frame.
  const photo = q.get('photo');
  if (photo) document.getElementById('img').src = photo;
  else document.getElementById('card').style.display = 'none';
  document.getElementById('tag').textContent = q.get('tag') || '';
  const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  document.getElementById('cap').innerHTML =
    gold && cap.includes(gold)
      ? esc(cap).replace(esc(gold), `<span class="g">${esc(gold)}</span>`)
      : esc(cap);
  // Every metal this answer names sits in the 3d row.
  const EL = {
    Cr: [24, 'क्रोमियम', '52.00', 6],  Fe: [26, 'लोहा',    '55.85', 8],
    Ni: [28, 'निकिल',    '58.69', 10], Cu: [29, 'ताँबा',   '63.55', 11],
    Zn: [30, 'जिंक',     '65.38', 12],
  };
  const el = q.get('el');
  if (el && EL[el]) {
    const [z, name, mass, group] = EL[el];
    document.body.classList.add('el');
    document.querySelector('#tile .z').textContent = z;
    document.querySelector('#tile .sym').textContent = el;
    document.querySelector('#tile .nm').textContent = name;
    document.querySelector('#tile .ms').textContent = mass;
    document.getElementById('blk').textContent =
      `d-ब्लॉक · आवर्त 4 · वर्ग ${group}`;
  }
  const im = document.getElementById('img');
  const done = () => { window.READY = true; };
  if (!photo) document.fonts.ready.then(done);
  // Signal ready on error too, so a wrong path shows as a blank card in the
  // mock instead of an opaque 30-second Playwright timeout.
  else if (im.complete) document.fonts.ready.then(done);
  else { im.onload = () => document.fonts.ready.then(done);
         im.onerror = () => { console.error('photo not found: ' + im.src); done(); }; }
</script>
