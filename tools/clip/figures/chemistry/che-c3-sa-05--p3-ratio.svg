<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470">
  <!-- साम्य स्थिरांक = अग्र वेग नियतांक / पश्च वेग नियतांक, written as a fraction
       of named boxes. Forward on top in cyan, backward below in warm: the same
       colours the equilibrium arrows used a moment ago. No text elements:
       every word comes from the spec. -->
  <rect id="num_box" data-optional x="480" y="90" width="550" height="140" rx="26"
        fill="#0E2A3A" fill-opacity="0.62" stroke="#78C0F0" stroke-width="6"/>
  <g id="bar" data-optional>
    <line x1="480" y1="250" x2="1030" y2="250" stroke="#E8C25A" stroke-width="9" stroke-linecap="round"/>
  </g>
  <rect id="den_box" data-optional x="480" y="270" width="550" height="140" rx="26"
        fill="#2E2012" fill-opacity="0.62" stroke="#F0A860" stroke-width="6"/>
  <rect id="k_box" data-optional x="50" y="185" width="360" height="130" rx="26"
        fill="#3A2E0C" fill-opacity="0.55" stroke="#E8C25A" stroke-width="6"/>
  <rect id="k_glow" data-optional x="36" y="171" width="388" height="158" rx="34"
        fill="none" stroke="#E8C25A" stroke-width="5"/>
</svg>
