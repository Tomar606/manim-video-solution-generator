<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470">
  <!-- "इकाई समय में अभिक्रिया कितनी तेजी से हो रही है": a stopwatch sweeping ONE
       unit of time beside a reaction that is visibly running (a metal strip
       fizzing in a tube of acid). Drawn, not generated: the user skipped Veo
       for this video on 2026-09-17. No text elements: every word comes from
       the spec. The bubbles are a stream shifted by one spacing per cycle and
       snapped back, clipped to the liquid, so the fizzing reads as continuous;
       the clip sits on a STATIC parent because engine.js moves the id'd child. -->
  <defs>
    <clipPath id="clip_liquid"><path d="M666,206 L774,206 L774,380 A54,54 0 0 1 666,380 Z"/></clipPath>
  </defs>

  <!-- ===== the stopwatch ===== -->
  <g id="watch" data-optional>
    <rect x="285" y="96" width="30" height="26" rx="6" fill="#DCE6EE"/>
    <circle cx="300" cy="250" r="122" fill="#0B1D24" fill-opacity="0.6" stroke="#DCE6EE" stroke-width="9"/>
    <line x1="300" y1="140" x2="300" y2="160" stroke="#DCE6EE" stroke-width="7" stroke-linecap="round"/>
    <line x1="410" y1="250" x2="390" y2="250" stroke="#DCE6EE" stroke-width="7" stroke-linecap="round"/>
    <line x1="300" y1="360" x2="300" y2="340" stroke="#DCE6EE" stroke-width="7" stroke-linecap="round"/>
    <line x1="190" y1="250" x2="210" y2="250" stroke="#DCE6EE" stroke-width="7" stroke-linecap="round"/>
  </g>
  <path id="sweep" data-optional d="M300,170 A80,80 0 0 1 380,250"
        fill="none" stroke="#E8C25A" stroke-width="22" stroke-linecap="butt"/>
  <line id="hand_0" data-optional x1="300" y1="250" x2="300" y2="168"
        stroke="#F2F2F2" stroke-width="9" stroke-linecap="round"/>
  <line id="hand_1" data-optional x1="300" y1="250" x2="382" y2="250"
        stroke="#F2F2F2" stroke-width="9" stroke-linecap="round"/>
  <circle id="hub" data-optional cx="300" cy="250" r="13" fill="#F2F2F2"/>

  <!-- ===== the reaction ===== -->
  <path id="liquid" data-optional d="M666,206 L774,206 L774,380 A54,54 0 0 1 666,380 Z"
        fill="#78C0F0" fill-opacity="0.32"/>
  <g clip-path="url(#clip_liquid)">
    <g id="bubbles" data-optional>
      <circle cx="694" cy="475" r="7" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="694" cy="430" r="7" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="694" cy="385" r="7" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="694" cy="340" r="7" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="694" cy="295" r="7" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="694" cy="250" r="7" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="694" cy="205" r="7" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="694" cy="160" r="7" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="720" cy="460" r="6" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="720" cy="415" r="6" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="720" cy="370" r="6" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="720" cy="325" r="6" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="720" cy="280" r="6" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="720" cy="235" r="6" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="720" cy="190" r="6" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="720" cy="145" r="6" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="746" cy="445" r="5" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="746" cy="400" r="5" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="746" cy="355" r="5" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="746" cy="310" r="5" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="746" cy="265" r="5" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="746" cy="220" r="5" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="746" cy="175" r="5" fill="#F2F2F2" fill-opacity="0.9"/>
      <circle cx="746" cy="130" r="5" fill="#F2F2F2" fill-opacity="0.9"/>
    </g>
  </g>
  <rect id="strip" data-optional x="694" y="408" width="52" height="14" rx="4" fill="#B9C3CC"/>
  <g id="tube" data-optional>
    <path d="M660,72 L660,380 A60,60 0 0 0 780,380 L780,72" fill="none" stroke="#DCE6EE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="644" y1="72" x2="796" y2="72" stroke="#DCE6EE" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
