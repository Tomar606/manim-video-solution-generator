<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470">
  <!-- The four things to remember. All four bars land together so the student
       has the map, then each row lights as it is spoken. Boxes are 100px tall
       because a 46px Devanagari label measures 69-76px with its matras and QA
       fails a label taller than its box minus 8.
       No word or number lives here: every label comes from the spec. -->

  <rect id="bar1" data-optional x="150" y="5"   width="880" height="100" rx="22"
        fill="#0B1F2E" fill-opacity="0.55" stroke="#5C6B7A" stroke-width="5"/>
  <rect id="bar2" data-optional x="150" y="125" width="880" height="100" rx="22"
        fill="#0B1F2E" fill-opacity="0.55" stroke="#5C6B7A" stroke-width="5"/>
  <rect id="bar3" data-optional x="150" y="245" width="880" height="100" rx="22"
        fill="#0B1F2E" fill-opacity="0.55" stroke="#5C6B7A" stroke-width="5"/>
  <rect id="bar4" data-optional x="150" y="365" width="880" height="100" rx="22"
        fill="#0B1F2E" fill-opacity="0.55" stroke="#5C6B7A" stroke-width="5"/>

  <circle id="chip1" data-optional cx="88" cy="55"  r="38" fill="#0B1F2E" stroke="#5C6B7A" stroke-width="6"/>
  <circle id="chip2" data-optional cx="88" cy="175" r="38" fill="#0B1F2E" stroke="#5C6B7A" stroke-width="6"/>
  <circle id="chip3" data-optional cx="88" cy="295" r="38" fill="#0B1F2E" stroke="#5C6B7A" stroke-width="6"/>
  <circle id="chip4" data-optional cx="88" cy="415" r="38" fill="#0B1F2E" stroke="#5C6B7A" stroke-width="6"/>

  <!-- the "being spoken now" plate: one of these is up at a time -->
  <g id="hi1" data-optional>
    <rect x="150" y="5" width="880" height="100" rx="22"
          fill="#2A1E05" fill-opacity="0.85" stroke="#FFC53D" stroke-width="7"/>
    <circle cx="88" cy="55" r="38" fill="#2A1E05" stroke="#FFC53D" stroke-width="7"/>
  </g>
  <g id="hi2" data-optional>
    <rect x="150" y="125" width="880" height="100" rx="22"
          fill="#2A1E05" fill-opacity="0.85" stroke="#FFC53D" stroke-width="7"/>
    <circle cx="88" cy="175" r="38" fill="#2A1E05" stroke="#FFC53D" stroke-width="7"/>
  </g>
  <g id="hi3" data-optional>
    <rect x="150" y="245" width="880" height="100" rx="22"
          fill="#2A1E05" fill-opacity="0.85" stroke="#FFC53D" stroke-width="7"/>
    <circle cx="88" cy="295" r="38" fill="#2A1E05" stroke="#FFC53D" stroke-width="7"/>
  </g>
  <g id="hi4" data-optional>
    <rect x="150" y="365" width="880" height="100" rx="22"
          fill="#2A1E05" fill-opacity="0.85" stroke="#FFC53D" stroke-width="7"/>
    <circle cx="88" cy="415" r="38" fill="#2A1E05" stroke="#FFC53D" stroke-width="7"/>
  </g>
</svg>
