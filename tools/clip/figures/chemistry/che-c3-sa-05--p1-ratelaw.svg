<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470">
  <!-- The rate equation as a row of symbols, with the meaning of each symbol
       in the row under it. k is ringed: it is the quantity this half of the
       difference is about. No text elements: every word comes from the spec. -->
  <rect id="eq_box" data-optional x="90" y="170" width="900" height="150" rx="30"
        fill="#0B1D24" fill-opacity="0.55" stroke="#DCE6EE" stroke-opacity="0.8" stroke-width="6"/>
  <circle id="k_ring" data-optional cx="464" cy="245" r="52"
          fill="#3A2E0C" fill-opacity="0.55" stroke="#E8C25A" stroke-width="7"/>
  <!-- ticks joining each symbol to its meaning below the box -->
  <g id="tick_rate" data-optional>
    <line x1="205" y1="326" x2="205" y2="352" stroke="#DCE6EE" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="tick_k" data-optional>
    <line x1="464" y1="326" x2="464" y2="352" stroke="#E8C25A" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="tick_conc" data-optional>
    <line x1="735" y1="326" x2="735" y2="352" stroke="#78C0F0" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
