      <g class="cc-xf"><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(20)"/><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(-20)"/></g>
