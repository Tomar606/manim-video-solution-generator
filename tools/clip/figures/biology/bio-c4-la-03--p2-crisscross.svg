      <g class="cc-xo"><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(20)"/><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(-20)"/></g>
      <g class="cc-xf"><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(20)"/><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(-20)"/></g>
    </g>
    <g transform="translate(758 352)">
      <g class="cc-xo"><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(20)"/><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(-20)"/></g>
      <g class="cc-xf"><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(20)"/><rect x="-11.4" y="-51.7" width="22.8" height="103.4" rx="11.4" transform="rotate(-20)"/></g>
    </g>
  </g>
  <line id="cc_ar_fd" data-optional x1="450" y1="162" x2="610.6" y2="282.5" stroke="#78C0F0" stroke-width="9" stroke-linecap="round"/>
  <path id="cc_ar_fd_hd" data-optional fill="#78C0F0" d="M626 294 L589.8 288.9 L611 260.7 Z"/>
  <line id="cc_ar_ms" data-optional x1="630" y1="162" x2="469.4" y2="282.5" stroke="#F2F2F2" stroke-width="9" stroke-linecap="round"/>
  <path id="cc_ar_ms_hd" data-optional fill="#F2F2F2" d="M454 294 L469 260.7 L490.2 288.9 Z"/>
