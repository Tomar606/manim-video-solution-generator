<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470">
  <!-- गुणन प्रावस्था, exactly the script's ON SCREEN direction:
       जनन एपीथीलियम → समसूत्री विभाजन → ऊगोनिया (केवल भ्रूणीय अवस्था में).
       It was in the script and never reached the video; part 2 then ran forty
       seconds with nothing on screen while he dictated it.

       Left to right is the direction of the process, and the one fact the
       exam wants beyond the chain - that this happens ONLY in the embryo - is
       a separate gold tag that arrives on the caption that says it. -->
  <style>
    .base  { stroke:#6E8A99; stroke-width:6; stroke-linecap:round }
    .epi   { fill:#78C0F0; fill-opacity:.30; stroke:#78C0F0; stroke-width:4 }
    .enuc  { fill:#78C0F0; fill-opacity:.85 }
    .arr   { stroke:#F2F2F2; stroke-width:6; stroke-linecap:round }
    .arrf  { fill:#F2F2F2 }
    .div   { fill:#78C0F0; fill-opacity:.22; stroke:#78C0F0; stroke-width:5 }
    .dnuc  { fill:#F0A860 }
    .oog   { fill:#F0A860; fill-opacity:.25; stroke:#F0A860; stroke-width:5 }
    .onuc  { fill:#F0A860; fill-opacity:.9 }
  </style>

  <!-- the germinal epithelium: a layer of cuboidal cells on its base -->
  <g id="epithelium" data-optional>
    <line class="base" x1="50" y1="262" x2="370" y2="262"/>
    <rect class="epi" x="56"  y="188" width="58" height="70" rx="6"/>
    <rect class="epi" x="118" y="188" width="58" height="70" rx="6"/>
    <rect class="epi" x="180" y="188" width="58" height="70" rx="6"/>
    <rect class="epi" x="242" y="188" width="58" height="70" rx="6"/>
    <rect class="epi" x="304" y="188" width="58" height="70" rx="6"/>
    <circle class="enuc" cx="85"  cy="223" r="11"/><circle class="enuc" cx="147" cy="223" r="11"/>
    <circle class="enuc" cx="209" cy="223" r="11"/><circle class="enuc" cx="271" cy="223" r="11"/>
    <circle class="enuc" cx="333" cy="223" r="11"/>
  </g>

  <!-- mitosis: one cell pinching into two, between two arrows -->
  <g id="arrow_in" data-optional>
    <line class="arr" x1="392" y1="223" x2="436" y2="223"/>
    <path class="arrf" d="M452 223 l-22 -13 v26 z"/>
  </g>
  <g id="dividing" data-optional>
    <path class="div" d="M470 223 c0 -52 48 -58 70 -30 c22 -28 70 -22 70 30 c0 52 -48 58 -70 30 c-22 28 -70 22 -70 -30 z"/>
    <circle class="dnuc" cx="508" cy="223" r="15"/>
    <circle class="dnuc" cx="572" cy="223" r="15"/>
  </g>
  <g id="arrow_out" data-optional>
    <line class="arr" x1="632" y1="223" x2="676" y2="223"/>
    <path class="arrf" d="M692 223 l-22 -13 v26 z"/>
  </g>

  <!-- the oogonia: many round cells with large nuclei -->
  <g id="oogonia" data-optional>
    <circle class="oog" cx="770" cy="170" r="42"/><circle class="onuc" cx="770" cy="170" r="16"/>
    <circle class="oog" cx="866" cy="150" r="42"/><circle class="onuc" cx="866" cy="150" r="16"/>
    <circle class="oog" cx="958" cy="190" r="42"/><circle class="onuc" cx="958" cy="190" r="16"/>
    <circle class="oog" cx="806" cy="262" r="42"/><circle class="onuc" cx="806" cy="262" r="16"/>
    <circle class="oog" cx="906" cy="276" r="42"/><circle class="onuc" cx="906" cy="276" r="16"/>
  </g>
</svg>
