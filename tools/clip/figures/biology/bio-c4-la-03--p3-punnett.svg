  <g id="pq_arXh" data-optional><path d="M365 254 L433 254" fill="none" stroke="#FF5A5A" stroke-width="7" stroke-linecap="round"/><path d="M615 254 L683 254" fill="none" stroke="#FF5A5A" stroke-width="7" stroke-linecap="round"/><rect x="82" y="146" width="114" height="136" rx="14" fill="none" stroke="#FF5A5A" stroke-width="5" stroke-linejoin="round"/><rect x="82" y="146" width="114" height="136" rx="14" fill="#FF5A5A" fill-opacity=".16"/></g>
  <g id="pq_arM1" data-optional><path d="M259 254 L327 254" fill="none" stroke="#E8C25A" stroke-width="7" stroke-linecap="round"/><rect x="233" y="23" width="224" height="96" rx="14" fill="none" stroke="#E8C25A" stroke-width="5" stroke-linejoin="round"/><rect x="233" y="23" width="224" height="96" rx="14" fill="#E8C25A" fill-opacity=".16"/></g>
  <g id="pq_arM2" data-optional><path d="M509 254 L577 254" fill="none" stroke="#E8C25A" stroke-width="7" stroke-linecap="round"/><rect x="483" y="23" width="224" height="96" rx="14" fill="none" stroke="#E8C25A" stroke-width="5" stroke-linejoin="round"/><rect x="483" y="23" width="224" height="96" rx="14" fill="#E8C25A" fill-opacity=".16"/></g>
  <g id="pq_fXh" data-optional><path d="M107.5 180 L147.8 236 M147.8 180 L107.5 236" fill="none" stroke="#F2F2F2" stroke-width="7" stroke-linecap="round"/><path d="M154 173 L154 203 M154 190.4 C155.5 181.4 171.3 181.4 171.3 191.6 L171.3 203" fill="none" stroke="#FF5A5A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="pq_fY" data-optional><path d="M118.8 332 L139 360 L159.2 332 M139 360 L139 388" fill="none" stroke="#F2F2F2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g id="pq_m1" data-optional><path d="M313.5 46 L353.8 102 M353.8 46 L313.5 102" fill="none" stroke="#F2F2F2" stroke-width="7" stroke-linecap="round"/><path d="M359.3 39 L359.3 69 M377.9 39 L377.9 69 M359.3 54 L377.9 54" fill="none" stroke="#F2F2F2" stroke-width="5" stroke-linecap="round"/></g>
  <g id="pq_m2" data-optional><path d="M563.5 46 L603.8 102 M603.8 46 L563.5 102" fill="none" stroke="#F2F2F2" stroke-width="7" stroke-linecap="round"/><path d="M609.4 39 L609.4 69 M627.9 39 L627.9 69 M609.4 54 L627.9 54" fill="none" stroke="#F2F2F2" stroke-width="5" stroke-linecap="round"/></g>
  <rect id="pq_sring" data-optional class="pq-ring" x="232" y="302" width="476" height="128" rx="20"/>
  </g>
</svg>
