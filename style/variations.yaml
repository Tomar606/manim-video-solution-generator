# Approved phrasings for the presenter.
#
# Each key is a moment that recurs in every video; each list is the alternatives
# the team has approved for it. The writer picks a different one each time a slot
# comes round, so ten videos don't all open the same way.
#
# THE GOVERNING RULE, from the team's review of the first scripts:
#
#   The SUBJECT MATTER stays formal. The CONNECTIVE TISSUE goes casual.
#
# "बर्कले एवं हार्टले की विधि" is still "विधि"; अर्धपारगम्य झिल्ली, परासरण दाब
# and ऐनोड are never softened. But the sentences BETWEEN the teaching — the
# check-ins, the nudges, the handoff, the sign-off — should sound like a person
# talking. Everyday English words that Hindi speakers actually say belong there,
# written in Devanagari: नेक्स्ट पार्ट, आंसर, फॉलो, एंड, मार्क्स.
#
# Do not over-Sanskritise ordinary speech: "यह पक्का आएगा ही आएगा", never
# "यह पूर्ण रूप से आएगा ही आएगा".
#
# CASUAL IS NOT RUDE. Warm and familiar, never mocking, never talking down.
# Explicitly forbidden: "अबे, इतना तुम्हारे दिमाग में नहीं बैठा क्या?",
# "भाई, नहीं आ रहा क्या इतना समझ में?".
#
# mode: inspiration  -> match the tone, reuse when it fits (default)
# mode: verbatim     -> use these exact lines at the matching moments
#
# Prose rules live in NOTES.md; the full format is in pyq_script_format.md.
mode: inspiration

# {वर्ष} is spoken as Hindi WORDS, never digits: 2026 -> "दो हज़ार छब्बीस".
# Several years keep the shortened middle: "दो हज़ार उन्नीस, इक्कीस और दो हज़ार
# तेईस". Values in the working go the other way: 2l is spoken "two-ell".
exam_line:   # follows the hook — it is NOT automatically the opening
  - एमपी बोर्ड कक्षा बारहवीं के बच्चों! ये सवाल {वर्ष} में आ चुका है और इस साल भी आपकी त्रैमासिक परीक्षा में आ सकता है।
  - एमपी बोर्ड कक्षा बारहवीं के बच्चों! ये सवाल {वर्ष} में आ चुका है — और इस साल भी आपकी त्रैमासिक परीक्षा में पूछा जा सकता है।

# The line after the exam line. Casual — this is not a teaching sentence.
promise:
  - एंड तक साथ रहो, पूरा टॉपिक क्लियर हो जाएगा।
  - एंड तक रहोगे, आंसर लिखने का तरीका पक्का सेट हो जाएगा।
  - एंड तक जुड़ो, जो डाउट है न, सब खत्म करके ही छोड़ूँगा।
  - एंड तक देखना, छोटे ट्रिक्स और कीवर्ड्स मिलेंगे जो सीधे मार्क्स दिलाएंगे।
  - एंड तक रुको, रिविजन पॉइंट्स मन में छप जाएंगे।
  - एंड तक रहना, एग्जाम में क्या लिखना है, पूरा भरोसा आ जाएगा।
  - एंड तक देखना, मज़ा भी आएगा और कॉन्सेप्ट पक्का बैठ जाएगा।

# The one-liner that starts the teaching.
opener:
  - चलो, अब शुरू करते हैं मज़े से।
  - आओ, पहले बुनियादी बात पकड़ते हैं।
  - ठीक है, सीधे मुद्दे पर आते हैं।
  - सुनो, अब समझ की पहली ईंट रखते हैं।
  - चलें, कांसेप्ट एकदम साफ करेंगे मिलकर।

# Said AFTER a concept lands and BEFORE the next one. The reviewer asked for
# these specifically: check the student is with you, then move on.
check_in:
  - चलो यहाँ तक क्लियर है? अब आगे बढ़ते हैं।
  - इतना दिमाग में बैठ गया? अब नेक्स्ट बिंदु पर चलते हैं।
  - यहीं तक सेट है ना? अब नेक्स्ट बात पकड़ते हैं।
  - ठीक है, कॉन्सेप्ट बैठ गया? अब प्रक्रिया का अगला कदम देखते हैं।
  - इतनी बात समझ आई? तो अब आगे की कड़ी जोड़ते हैं।
  - अब तक साथ हो ना? चलो आगे की तरफ बढ़ते हैं।
  - यह हिस्सा क्लियर? अब नया पॉइंट समझते हैं।
  - मन में बैठ गया इतना? चलो अब कदम बढ़ाएँ आगे।
  - बढ़िया, यहाँ तक हो गया? अब आगे की ओर चलते हैं।
  - ओके, इतना हो गया पक्का? अब नेक्स्ट स्टेप पर चलते हैं।

# The way into a new concept. {पद} is the term, and the term itself is never
# made casual — only the sentence carrying it.
definition_opener:
  - चलो इतना हो गया? अब आगे बढ़ते हैं। {पद} क्या होता है, छोटा सा साफ करें।
  - ठीक है, अब {पद} की परिभाषा एकदम सटीक तरीके से सुनो।
  - जो पढ़ा मज़बूत। अब {पद} का मतलब एक लाइन में तय कर लेते हैं।
  - नेक्स्ट चलते हैं, {पद} की परिभाषा मन में छाप लो, यही काम आएगी।
  - यह बात अब मत भूलना, {पद} की सही परिभाषा ये सुनो ध्यान से।
  - बढ़िया, अब {पद} को परिभाषित करते हैं, ताकि आंसर में सीधे लिख सको।
  - अभी तक क्लियर? तो {पद} की परिभाषा एकदम छोटे में बता दूँ।
  - चलिए, {पद} का अर्थ बिल्कुल स्पष्ट कर लें, फिर सवालों पर आएँगे।

# Say this BEFORE the definition or the tricky point, never after, and always
# with the reason attached. "यहीं नंबर कटते हैं" belongs where marks are
# genuinely lost — a reversed sign, a dropped unit — not sprinkled for tone.
focus_cue:
  - यह बात अब मत भूलना, ये सुनो ध्यान से, यहीं से परिभाषा शुरू होती है।
  - ध्यान से सुनो, यहीं नंबर कटते हैं, बच्चे शब्द बदल देते हैं।
  - इस बात को दिमाग में बिठा लो, पेपर में यही लाइन मांगी जाती है।
  - इस बात को मन में छाप लो, यही कॉमन गलती आंसर बिगाड़ देती है।
  - ज़रा ठहरो, मुख्य बात आ रही है, यही लिखोगे तो पक्के मार्क्स मिलेंगे।
  - सुनो ध्यान से, परिभाषा का असली शब्द यही है, बाकी से अर्थ बदल जाएगा।
  - अब फोकस करो, इसी जगह पर उलझन होती है, गलती से पूरा आंसर उलट जाता है।
  - इसे गौर से पकड़ो, बोर्ड चेकिंग में यही शब्द देखा जाता है।
  - थोड़ा ध्यान जमा लो, परिभाषा पहले समझो, तभी नेक्स्ट लाइनें अपने आप बनेंगी।
  - यह बात दिल में रखो, अक्सर यहां उदाहरण लिख देते हैं, जबकि परिभाषा चाहिए।

# The last line of a part. {आगे} is what the next part covers, and it must be
# named. Prefer "नेक्स्ट पार्ट में मिलते हैं" over "अगले पार्ट में".
transition:
  - चलो इतना हो गया? अब नेक्स्ट पार्ट में मिलते हैं, {आगे}
  - तो यहाँ तक कर लिया आपने, बहुत बढ़िया। नेक्स्ट पार्ट में मिलते हैं, {आगे}
  - यहाँ रुकते हैं एक पल, फिर नेक्स्ट पार्ट में मिलते हैं, {आगे}
  - शाबाश, बेसिक्स सेट हो गए। अब नेक्स्ट पार्ट में मिलते हैं, {आगे}
  - तो यहाँ तक तो बेटा कर लिया? सही बात है! नेक्स्ट पार्ट में मिलते हैं, {आगे}
  - रीकैप हो गया। अब असली यूज़ दिखाऊँगा, नेक्स्ट पार्ट में मिलते हैं, {आगे}
  - अभी तक का काम क्लियर? चलो, नेक्स्ट पार्ट में मिलते हैं, {आगे}
  - कॉन्सेप्ट पकड़ लिया आपने, ग्रेट। अब नेक्स्ट पार्ट में मिलते हैं, {आगे}
  - अब आंसर में क्या लिखना है, उसकी पूरी ट्रिक नेक्स्ट पार्ट में मिलते हैं, {आगे}

# The FIRST line of a later part. {पिछला} is what the previous part
# established. Parts publish as separate clips, so this is never optional.
recap:
  - चलो, {पिछला} तक तो पक्का हो गया था। अब यहीं से आगे बढ़ते हैं।
  - जहाँ छोड़ा था, वहाँ तक {पिछला} क्लियर कर लिया था। अब नया पॉइंट उठाते हैं।
  - ठीक है, {पिछला} वाली बात समझ ली थी। अब चलो सीधे एप्लीकेशन पर चलते हैं।
  - बढ़िया, {पिछला} तक पहुँच गए थे हम। अब इसी बेस पर नई बात करेंगे।
  - याद है, {पिछला} क्लियर करके रोका था। अब एक कदम आगे बढ़ो मेरे साथ।
  - तो {पिछला} तक का कॉन्सेप्ट बैठ गया था। अब सवाल की तरफ मूव करते हैं।
  - चलो इतना हो गया था, {पिछला} सेट कर लिया था। अब डीटेल में आगे बढ़ते हैं।
  - हमने {पिछला} तक फिक्स कर दिया था। अब बस लिंक जोड़ना है आगे के लिए।

# The sign-off. Creator-style — the reviewer asked for "फॉलो कर लो" and
# "फॉलो करना मत भूलना, फायदा हो जाएगा".
closing:
  - वीडियो अच्छी लगी हो तो फॉलो कर लो, नेक्स्ट पार्ट में और बेहतर आंसर लिखवाऊंगा।
  - फॉलो करना मत भूलना, फायदा हो जाएगा, मार्क्स भी ऊपर चलेंगे।
  - डेली पढ़ाई के लिए अरिविहान के 'उन्नति बैच' से जुड़ें, और अभी फॉलो कर लो।
  - नेक्स्ट अपडेट्स चाहिए तो फॉलो कर लो, और अरिविहान के 'उन्नति बैच' से जुड़ें।
  - आज इतना काफी है, नेक्स्ट पार्ट में मिलते हैं, जाने से पहले फॉलो कर लो।
  - एंड में बस इतना, मेहनत जारी रखो, फॉलो कर लो, और आंसर प्रैक्टिस करते रहो।
  - फॉलो कर लो, डेली शॉर्ट रिविज़न मिलेगा, एग्जाम में भरोसा बढ़ेगा, मार्क्स ऊपर जाएंगे।
  - कम्युनिटी में आओ, अरिविहान के 'उन्नति बैच' से जुड़ें, और नेक्स्ट पार्ट के लिए फॉलो कर लो।
